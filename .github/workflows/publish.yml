# Publishes MCPulse to nuget.org when a version tag is pushed.
#
# Trusted Publishing rather than a stored API key. NuGet trusts *this workflow
# in this repository* and hands it a token that lives for the length of the run,
# so there is no long-lived secret in the repo settings to leak, rotate or
# forget. The trust is registered once at
# https://www.nuget.org/account/trustedpublishing, and the "Workflow File"
# field there is the name of this file: publish.yml
name: Publish

on:
  push:
    tags:
      - "v*"
  # So a failed publish can be retried without inventing a tag.
  workflow_dispatch:

permissions:
  # The whole point: this is what lets the job mint an OIDC token for NuGet.
  # Without it the login step fails with a message about the audience, which
  # reads like a NuGet problem rather than a permissions one.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # The suite is a console app with its own Main rather than xunit, so it
      # runs rather than being tested. A non-zero exit fails the job, which is
      # the only contract `dotnet test` would have given us anyway.
      - name: Run the conformance suite
        run: dotnet run --project tests/MCPulse.Tests -c Release

      - name: Pack
        run: dotnet pack src/MCPulse/MCPulse.csproj -c Release --output ./artifacts

      - name: Get a short-lived NuGet token
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org account that owns the trust policy. Set it once at
          # Settings → Secrets and variables → Actions → Variables.
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
